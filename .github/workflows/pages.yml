name: pages
on:
  push:
    branches: [release/human-welfare-hmc]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp web/index.html _site/index.html
          cp web/demo.html _site/demo.html
          cp -a distribution _site/distribution
          mkdir -p _site/master
          cp -a master/research _site/master/research
          cp -a master/knowledge _site/master/knowledge
          cp -a master/production _site/master/production
          touch _site/.nojekyll
          # Published site root is this folder, so links are not ../ 
          sed -i 's|href="../|href="./|g' _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
